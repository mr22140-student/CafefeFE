<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pruebas CafefeFE</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
        code { background: #f3ede6; padding: 0 .3rem; border-radius: .25rem; }
        .todas { display: inline-block; margin: .25rem .5rem .25rem 0; padding: .5rem 1rem; border-radius: .5rem; background: #6b3e26; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <h1>Pruebas CafefeFE</h1>
    <p>
        <a class="todas" href="unit.html">Todas las unitarias</a>
        <a class="todas" href="it.html">Todas las de integración</a>
    </p>
    <p>Las <strong>unitarias</strong> simulan <code>fetch</code> con sinon: no necesitan el backend.
       Las de <strong>integración</strong> necesitan CafefeSV corriendo en NetBeans y la base de datos.</p>
    <div id="lista"></div>
    <script type="module">
        import { UNITARIAS, INTEGRACION } from "./js/lista_pruebas.js";
        const fila = (pagina, a) => `<li><a href="${pagina}?archivo=${a}">${a}</a></li>`;
        document.getElementById("lista").innerHTML =
            `<h2>Unitarias</h2><ul>${UNITARIAS.map(a => fila("unit.html", a)).join("")}</ul>` +
            `<h2>Integración</h2><ul>${INTEGRACION.map(a => fila("it.html", a)).join("")}</ul>`;
    </script>
</body>
</html>
